<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Μενού Καταλύματος</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            color: #1a1a1a;
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Κουμπί για τους ενοίκους (IN) */
        .btn-in {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        /* Κουμπί για τους επισκέπτες πισίνας (OUT) */
        .btn-out {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Καλώς ήρθατε!</h1>
        <p>Παρακαλώ επιλέξτε τον κατάλογο που σας αφορά:</p>

        <div class="btn-container">
            <a href="in.pdf" target="_blank" class="btn btn-in">
                🏨 Ένοικοι Καταλύματος (IN)
            </a>
            
            <a href="out.pdf" target="_blank" class="btn btn-out">
                🏊‍♂️ Επισκέπτες Πισίνας & Café (OUT)
            </a>
        </div>

        <div class="footer">
            Καλή σας απόλαυση!
        </div>
    </div>

</body>
</html>
